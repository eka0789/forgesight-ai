# ForgeSight AI — local/production-like stack (Docker Compose)
# Usage:
#   cp .env.example .env   (edit SECRET_KEY etc.)
#   docker compose up -d --build
#   open http://localhost:3000  (web)  · http://localhost:8000/docs (API)
name: forgesight-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: forgesight
      POSTGRES_PASSWORD: forgesight
      POSTGRES_DB: forgesight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgesight"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false   # compose defaults are complete for local runs
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg2://forgesight:forgesight@postgres:5432/forgesight
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: forgesight
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SEED_DEMO: "true"
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrate → optional demo seed → serve. (Explicit grouping so a seed
    # failure can never skip migrations, and a migration failure never
    # silently starts the server on a stale schema.)
    command: >
      sh -c "alembic upgrade head && { python -m app.seed || echo '[api] demo seed skipped/failed — continuing'; } && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      sh -c "pip install psycopg2-binary && 
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri postgresql+psycopg2://forgesight:forgesight@postgres:5432/mlflow
             --artifacts-destination /mlruns"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3001"

volumes:
  pgdata:
  miniodata:
  grafanadata:
  storage:
